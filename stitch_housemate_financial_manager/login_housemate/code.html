<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - HouseMate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#0053db",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary-container": "#54647a",
                        "background": "#faf8ff",
                        "on-secondary": "#ffffff",
                        "on-surface": "#191b23",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e1e2ed",
                        "surface-bright": "#faf8ff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#b4c5ff",
                        "on-primary-fixed": "#00174b",
                        "outline": "#737686",
                        "tertiary": "#943700",
                        "surface-dim": "#d9d9e5",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#ffede6",
                        "secondary": "#505f76",
                        "secondary-fixed": "#d3e4fe",
                        "inverse-surface": "#2e3039",
                        "on-error": "#ffffff",
                        "outline-variant": "#c3c6d7",
                        "tertiary-fixed-dim": "#ffb596",
                        "surface": "#faf8ff",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#e7e7f3",
                        "tertiary-container": "#bc4800",
                        "secondary-container": "#d0e1fb",
                        "on-background": "#191b23",
                        "on-surface-variant": "#434655",
                        "surface-container": "#ededf9",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e1e2ed",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "inverse-on-surface": "#f0f0fb",
                        "primary": "#004ac6",
                        "surface-container-low": "#f3f3fe",
                        "on-tertiary-fixed": "#360f00",
                        "primary-container": "#2563eb",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#0b1c30",
                        "on-primary-fixed-variant": "#003ea8",
                        "tertiary-fixed": "#ffdbcd",
                        "primary-fixed": "#dbe1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "xxl": "48px",
                        "base": "4px",
                        "lg": "24px",
                        "xl": "32px",
                        "container-max": "1200px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "sm": "12px",
                        "md": "16px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-financial": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-financial": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Note: TopNavBar, SideNavBar, BottomNavBar are intentionally suppressed per instructions for Login/Transactional screens -->
<main class="w-full max-w-md w-full bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_rgba(0,0,0,0.05),0_1px_2px_rgba(0,0,0,0.03)] p-xl overflow-hidden relative">
<!-- Decorative subtle background pattern -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, currentColor 1px, transparent 0); background-size: 24px 24px;"></div>
<div class="relative z-10 flex flex-col items-center mb-lg text-center">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-md text-on-primary-container">
<span class="material-symbols-outlined text-display-financial font-display-financial" data-icon="home_work">home_work</span>
</div>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Welcome back</h1>
<p class="font-body-md text-body-md text-secondary">Log in to manage your shared expenses and harmony.</p>
</div>
<form action="#" class="space-y-lg relative z-10" method="POST">
<div class="space-y-sm">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-base" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-xl pr-sm py-sm border border-outline-variant rounded-xl bg-surface-container-lowest text-on-surface placeholder-secondary focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-shadow" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-base" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-xl pr-sm py-sm border border-outline-variant rounded-xl bg-surface-container-lowest text-on-surface placeholder-secondary focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<div class="flex items-center justify-between mt-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-xs block font-label-md text-label-md text-secondary" for="remember-me">
                        Remember me
                    </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-sm px-4 border border-transparent rounded-xl shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors min-h-[48px] items-center" type="submit">
                    Login
                </button>
</div>
<div class="text-center mt-md">
<p class="font-body-md text-body-md text-secondary">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Register</a>
</p>
</div>
</form>
</main>
</body></html>
