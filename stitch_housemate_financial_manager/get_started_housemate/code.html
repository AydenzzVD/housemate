<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Main Container -->
<main class="w-full max-w-4xl mx-auto flex flex-col items-center">
<!-- Header Section -->
<div class="text-center mb-xl w-full max-w-2xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm">
                Welcome to HouseMate
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Manage your shared house expenses with your roommates. Choose how you want to get started.
            </p>
</div>
<!-- Choice Cards Container (Bento Grid Style) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg w-full max-w-3xl">
<!-- Create a House Card -->
<button class="group bg-surface rounded-[16px] p-lg shadow-level-1 hover:shadow-level-2 transition-all duration-300 border border-transparent hover:border-primary-fixed-dim text-left flex flex-col relative overflow-hidden h-full">
<!-- Subtle Background Decoration -->
<div class="absolute -right-12 -top-12 w-48 h-48 bg-primary/5 rounded-full blur-3xl group-hover:bg-primary/10 transition-colors duration-500"></div>
<div class="bg-primary-container text-on-primary-container w-16 h-16 rounded-full flex items-center justify-center mb-lg relative z-10">
<span class="material-symbols-outlined text-[32px]" data-icon="add_home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_home</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm relative z-10">Create a House</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl relative z-10 flex-grow">
                    You're the organizer. Set up a new house and invite your roommates to join.
                </p>
<div class="flex items-center text-primary font-label-md text-label-md group-hover:translate-x-2 transition-transform duration-300 relative z-10">
<span class="mr-base">Start Setting Up</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</div>
</button>
<!-- Join a House Card -->
<button class="group bg-surface rounded-[16px] p-lg shadow-level-1 hover:shadow-level-2 transition-all duration-300 border border-transparent hover:border-secondary-fixed-dim text-left flex flex-col relative overflow-hidden h-full">
<!-- Subtle Background Decoration -->
<div class="absolute -left-12 -bottom-12 w-48 h-48 bg-secondary/5 rounded-full blur-3xl group-hover:bg-secondary/10 transition-colors duration-500"></div>
<div class="bg-secondary-container text-on-secondary-container w-16 h-16 rounded-full flex items-center justify-center mb-lg relative z-10">
<span class="material-symbols-outlined text-[32px]" data-icon="login" data-weight="fill" style="font-variation-settings: 'FILL' 1;">login</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm relative z-10">Join a House</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl relative z-10 flex-grow">
                    Your roommate already set things up? Enter your house code here.
                </p>
<div class="flex items-center text-secondary font-label-md text-label-md group-hover:translate-x-2 transition-transform duration-300 relative z-10">
<span class="mr-base">Enter House Code</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</div>
</button>
</div>
