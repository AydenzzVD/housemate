<!DOCTYPE html>

<html class="light" lang="en"><head>

                        "on-error": "#ffffff",
                        "outline-variant": "#c3c6d7",
                        "tertiary-fixed-dim": "#ffb596",
                        "surface": "#faf8ff",

<style>
        /* Custom Input resets */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        
        .cat-btn.active {
            border-color: theme('colors.primary');
            background-color: theme('colors.primary/10');
            color: theme('colors.primary');
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-sans antialiased overflow-x-hidden flex">
<!-- Desktop Side Navigation -->
<nav class="hidden md:flex flex-col h-full py-xl px-md fixed left-0 top-0 h-full w-[280px] bg-surface dark:bg-on-surface shadow-sm z-50">
<!-- Header -->
<div class="mb-xl px-sm">
<div class="flex items-center gap-sm mb-xs">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary font-bold">HM</div>
<h1 class="font-headline-lg text-headline-lg font-black text-primary dark:text-primary-fixed">HouseMate</h1>
</div>
<p class="font-label-md text-label-md text-secondary ml-10">Shared Living Harmony</p>
</div>
<!-- Main Nav -->
<div class="flex-1 space-y-2">
<a class="flex items-center gap-md px-sm py-xs rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-high transition-all cursor-pointer transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-weight="fill">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
<a class="flex items-center gap-md px-sm py-xs rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-high transition-all cursor-pointer transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-weight="fill">home_work</span>
<span class="font-label-md text-label-md">House</span>
</a>
<!-- Active State -->
<a class="flex items-center gap-md px-sm py-xs rounded-lg bg-primary/10 dark:bg-primary-fixed/10 text-primary dark:text-primary-fixed border-l-4 border-primary cursor-pointer transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-weight="fill">receipt_long</span>
<span class="font-label-md text-label-md">Expenses</span>
</a>
<a class="flex items-center gap-md px-sm py-xs rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-high transition-all cursor-pointer transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-weight="fill">payments</span>
<span class="font-label-md text-label-md">Payments</span>
</a>
<a class="flex items-center gap-md px-sm py-xs rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-high transition-all cursor-pointer transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-weight="fill">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</div>
<!-- CTA -->
<div class="my-lg">
<button class="w-full bg-primary text-on-primary rounded-xl py-sm font-label-md text-label-md flex items-center justify-center gap-xs shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.1),_0px_4px_6px_-2px_rgba(0,0,0,0.05)] hover:bg-primary-fixed-variant transition-colors">
<span class="material-symbols-outlined text-[18px]">add</span>
                Add Expense
            </button>
</div>
<!-- Footer Nav -->
<div class="space-y-2 mt-auto border-t border-surface-variant pt-lg">
<a class="flex items-center gap-md px-sm py-xs rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-high transition-all cursor-pointer transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-weight="fill">account_circle</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
<a class="flex items-center gap-md px-sm py-xs rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-high transition-all cursor-pointer transition-transform duration-200 text-error" href="#">
<span class="material-symbols-outlined" data-weight="fill">logout</span>
<span class="font-label-md text-label-md">Logout</span>
</a>
</div>
</nav>
<!-- Top Nav Mobile -->
<header class="md:hidden flex justify-between items-center w-full px-margin-mobile py-4 shadow-sm bg-surface dark:bg-on-surface docked full-width top-0 z-40 fixed">
<div class="flex items-center gap-sm">
<a class="text-secondary" href="#"><span class="material-symbols-outlined">arrow_back</span></a>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Add Expense</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 md:ml-[280px] w-full mt-16 md:mt-0 pb-24 md:pb-0 px-margin-mobile md:px-margin-desktop py-lg max-w-container-max mx-auto h-screen flex flex-col">
<div class="max-w-2xl mx-auto w-full flex-1 flex flex-col bg-surface rounded-2xl shadow-[0px_1px_3px_rgba(0,0,0,0.05),_0px_1px_2px_rgba(0,0,0,0.03)] p-lg overflow-y-auto">
<div class="hidden md:flex items-center gap-sm mb-xl">
<a class="text-secondary hover:text-primary transition-colors" href="#"><span class="material-symbols-outlined">arrow_back</span></a>
<h2 class="font-headline-lg text-headline-lg text-on-surface">New Expense</h2>
</div>
<!-- Amount Input - Giant focal point -->
<div class="flex flex-col items-center justify-center py-xl border-b border-surface-variant mb-lg">
<label class="sr-only" for="amount">Expense Amount</label>
<div class="flex items-center text-primary">
<span class="font-display-financial text-display-financial mr-xs">$</span>
<input autofocus="" class="w-full max-w-[200px] bg-transparent border-none p-0 text-center font-display-financial text-display-financial text-on-surface focus:ring-0 placeholder:text-surface-variant" id="amount" placeholder="0.00" type="number"/>
</div>
</div>
<form class="flex-1 flex flex-col space-y-lg">
<!-- Categories -->
<div>
<h3 class="font-label-md text-label-md text-secondary mb-sm">Category</h3>
<div class="grid grid-cols-3 sm:grid-cols-4 gap-sm">
<button class="cat-btn flex flex-col items-center justify-center p-sm rounded-xl border border-surface-variant bg-surface hover:border-primary/50 transition-all active" type="button">
<span class="material-symbols-outlined text-[28px] mb-base">restaurant</span>
<span class="font-label-sm text-label-sm text-center">Food</span>
</button>
<button class="cat-btn flex flex-col items-center justify-center p-sm rounded-xl border border-surface-variant bg-surface hover:border-primary/50 transition-all text-secondary" type="button">
<span class="material-symbols-outlined text-[28px] mb-base">shopping_cart</span>
<span class="font-label-sm text-label-sm text-center">Groceries</span>
</button>
<button class="cat-btn flex flex-col items-center justify-center p-sm rounded-xl border border-surface-variant bg-surface hover:border-primary/50 transition-all text-secondary" type="button">
<span class="material-symbols-outlined text-[28px] mb-base">commute</span>
<span class="font-label-sm text-label-sm text-center">Transport</span>
</button>
<button class="cat-btn flex flex-col items-center justify-center p-sm rounded-xl border border-surface-variant bg-surface hover:border-primary/50 transition-all text-secondary" type="button">
<span class="material-symbols-outlined text-[28px] mb-base">bolt</span>
<span class="font-label-sm text-label-sm text-center">Utilities</span>
</button>
<button class="cat-btn flex flex-col items-center justify-center p-sm rounded-xl border border-surface-variant bg-surface hover:border-primary/50 transition-all text-secondary" type="button">
<span class="material-symbols-outlined text-[28px] mb-base">local_bar</span>
<span class="font-label-sm text-label-sm text-center">Fun</span>
</button>
<button class="cat-btn flex flex-col items-center justify-center p-sm rounded-xl border border-surface-variant bg-surface hover:border-primary/50 transition-all text-secondary" type="button">
<span class="material-symbols-outlined text-[28px] mb-base">home</span>
<span class="font-label-sm text-label-sm text-center">House</span>
</button>
</div>
</div>
<!-- Date & Split -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
<div class="flex flex-col">
<label class="font-label-md text-label-md text-secondary mb-xs" for="date">Date</label>
<div class="relative">
<input class="w-full border border-surface-variant rounded-xl px-sm py-sm focus:ring-2 focus:ring-primary focus:border-primary bg-surface font-body-md text-body-md" id="date" type="date" value="2024-05-20"/>
</div>
</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-secondary mb-xs" for="split">Split Method</label>
<select class="w-full border border-surface-variant rounded-xl px-sm py-sm focus:ring-2 focus:ring-primary focus:border-primary bg-surface font-body-md text-body-md" id="split">
<option>Equally (3 ways)</option>
<option>Exact Amounts</option>
<option>Percentages</option>
</select>
</div>
</div>
<!-- Note -->
<div class="flex flex-col flex-1">
<label class="font-label-md text-label-md text-secondary mb-xs" for="note">Note (Optional)</label>
<textarea class="w-full border border-surface-variant rounded-xl px-sm py-sm focus:ring-2 focus:ring-primary focus:border-primary bg-surface font-body-md text-body-md resize-none" id="note" placeholder="What was this for?" rows="2"></textarea>
</div>
<!-- Action -->
<div class="mt-auto pt-lg">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md rounded-xl py-sm min-h-[48px] shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.1),_0px_4px_6px_-2px_rgba(0,0,0,0.05)] hover:bg-primary/90 transition-colors" type="submit">
                        Save Expense
                    </button>
</div>
</form>
</div>
</main>
<script>
        // Simple cat selection logic
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.classList.remove('active');
                    b.classList.add('text-secondary');
                });
                this.classList.add('active');
                this.classList.remove('text-secondary');
            });
        });
    </script>
</body></html>
