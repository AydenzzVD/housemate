<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - HouseMate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                            "outline": "#737686",
                            "tertiary": "#943700",

                            "error-container": "#ffdad6",
                            "on-tertiary-container": "#ffede6",
                            "secondary": "#505f76",
                            "secondary-fixed": "#d3e4fe",
                            "inverse-surface": "#2e3039",
                            "on-error": "#ffffff",
                            "outline-variant": "#c3c6d7",
                            "tertiary-fixed-dim": "#ffb596",
                            "surface": "#faf8ff",
                            "on-tertiary": "#ffffff",
                            "surface-container-high": "#e7e7f3",
                            "tertiary-container": "#bc4800",
                            "secondary-container": "#d0e1fb",
                            "on-background": "#191b23",
                            "on-surface-variant": "#434655",
                            "surface-container": "#ededf9",
                            "primary-fixed-dim": "#b4c5ff",
                            "surface-container-lowest": "#ffffff",
                            "surface-container-highest": "#e1e2ed",
                            "on-tertiary-fixed-variant": "#7d2d00",
                            "inverse-on-surface": "#f0f0fb",
                            "primary": "#004ac6",
                            "surface-container-low": "#f3f3fe",
                            "on-tertiary-fixed": "#360f00",

                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",

                    "spacing": {
                            "xs": "8px",

<style>
        .ambient-shadow-card {
            box-shadow: 0px 1px 3px rgba(0,0,0,0.05), 0px 1px 2px rgba(0,0,0,0.03);
        }
        .ambient-shadow-interactive:hover {
            box-shadow: 0px 10px 15px -3px rgba(0,0,0,0.1), 0px 4px 6px -2px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Registration Card -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-[16px] p-[24px] ambient-shadow-card flex flex-col gap-lg border border-surface-variant">
<!-- Header -->
<div class="text-center space-y-sm">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-on-primary-container mb-2">
<span class="material-symbols-outlined" data-icon="home_work" data-weight="fill" style="font-variation-settings: 'FILL' 1; font-size: 24px;">home_work</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Join HouseMate</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Financial harmony for shared living.</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-sm" method="POST">
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface" for="name">Full Name</label>
<input class="w-full rounded-[12px] border border-outline-variant bg-surface-container-lowest px-md py-sm text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-shadow" id="name" name="name" placeholder="Alex Taylor" required="" type="text"/>
</div>
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full rounded-[12px] border border-outline-variant bg-surface-container-lowest px-md py-sm text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-shadow" id="email" name="email" placeholder="alex@example.com" required="" type="email"/>
</div>
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<input class="w-full rounded-[12px] border border-outline-variant bg-surface-container-lowest px-md py-sm text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">Confirm Password</label>
<input class="w-full rounded-[12px] border border-outline-variant bg-surface-container-lowest px-md py-sm text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-shadow" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full mt-sm min-h-[48px] bg-primary text-on-primary rounded-[12px] font-label-md text-label-md transition-all duration-200 ambient-shadow-interactive hover:bg-surface-tint active:scale-[0.98] flex items-center justify-center gap-xs" type="submit">
<span>Register</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="text-center mt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary hover:text-primary-container font-label-md text-label-md transition-colors" href="#">Login</a>
</p>
</div>
</main>
</body></html>
