<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HouseMate - Create House</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#0053db",
                      "on-primary-container": "#eeefff",
                      "secondary-fixed-dim": "#b7c8e1",
                      "on-secondary-fixed-variant": "#38485d",
                      "on-secondary-container": "#54647a",
                      "background": "#faf8ff",
                      "on-secondary": "#ffffff",
                      "on-surface": "#191b23",
                      "on-primary": "#ffffff",
                      "surface-variant": "#e1e2ed",
                      "surface-bright": "#faf8ff",
                      "on-error-container": "#93000a",
                      "inverse-primary": "#b4c5ff",
                      "on-primary-fixed": "#00174b",
                      "outline": "#737686",
                      "tertiary": "#943700",
                      "surface-dim": "#d9d9e5",
                      "error-container": "#ffdad6",
                      "on-tertiary-container": "#ffede6",
                      "secondary": "#505f76",
                      "secondary-fixed": "#d3e4fe",
                      "inverse-surface": "#2e3039",
                      "on-error": "#ffffff",
                      "outline-variant": "#c3c6d7",
                      "tertiary-fixed-dim": "#ffb596",
                      "surface": "#faf8ff",
                      "on-tertiary": "#ffffff",
                      "surface-container-high": "#e7e7f3",
                      "tertiary-container": "#bc4800",
                      "secondary-container": "#d0e1fb",
                      "on-background": "#191b23",
                      "on-surface-variant": "#434655",
                      "surface-container": "#ededf9",
                      "primary-fixed-dim": "#b4c5ff",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#e1e2ed",
                      "on-tertiary-fixed-variant": "#7d2d00",
                      "inverse-on-surface": "#f0f0fb",
                      "primary": "#004ac6",
                      "surface-container-low": "#f3f3fe",
                      "on-tertiary-fixed": "#360f00",
                      "primary-container": "#2563eb",
                      "error": "#ba1a1a",
                      "on-secondary-fixed": "#0b1c30",
                      "on-primary-fixed-variant": "#003ea8",
                      "tertiary-fixed": "#ffdbcd",
                      "primary-fixed": "#dbe1ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xs": "8px",
                      "xxl": "48px",
                      "base": "4px",
                      "lg": "24px",
                      "xl": "32px",
                      "container-max": "1200px",
                      "gutter": "16px",
                      "margin-mobile": "16px",
                      "sm": "12px",
                      "md": "16px",
                      "margin-desktop": "32px"
              },
              "fontFamily": {
                      "headline-lg-mobile": [
                              "Inter"
                      ],
                      "label-sm": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "label-md": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Inter"
                      ],
                      "display-financial": [

                      ],
                      "body-lg": [

                      ]
              },
              "fontSize": {
                      "headline-lg-mobile": [
                              "24px",

                                      "lineHeight": "32px",
                                      "fontWeight": "600"

                      ],

                      ],
                      "body-md": [

                      ],
                      "headline-md": [
                              "20px",

                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "label-md": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "500"
                              }
                      ],
                      "headline-lg": [
                              "30px",
                              {
                                      "lineHeight": "36px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"

                      ],
                      "display-financial": [
                              "40px",
                              {
                                      "lineHeight": "48px",
                                      "letterSpacing": "-0.02em",

                      "body-lg": [

          },
        }
      </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary/20 selection:text-primary">
<!-- Header (Transactional, minimal nav) -->
<header class="w-full flex items-center justify-between p-margin-mobile md:px-margin-desktop py-4 bg-surface shadow-sm z-10 sticky top-0">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-on-surface">
            Create House
        </div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile w-full max-w-container-max mx-auto relative overflow-hidden">
<!-- Abstract Background Decorative Element -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container rounded-full blur-[100px] opacity-20 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary-container rounded-full blur-[80px] opacity-10 pointer-events-none"></div>
<div class="w-full max-w-md space-y-xl relative z-10">
<!-- Step 1: Create House Form (Simulated hidden state for demo purposes, usually handled by JS. Here we show the result state below, but let's build a combined view or progressive disclosure) -->
<div class="glass-panel rounded-[16px] p-lg shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1),0_4px_6px_-2px_rgba(0,0,0,0.05)] transition-all duration-300 transform scale-100 opacity-100 hidden" id="step-create">
<div class="flex flex-col items-center mb-lg">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">home_work</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-center text-on-surface">Set up your shared home</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Give your house a name to start collaborating.</p>
</div>
<div class="space-y-sm mb-lg">
<label class="block font-label-md text-label-md text-on-surface" for="house-name">House Name</label>
<input class="w-full h-[48px] px-sm rounded-lg border border-outline-variant bg-surface-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-all placeholder:text-outline" id="house-name" placeholder="e.g., The Blue Door, Our House..." type="text"/>
</div>
<button class="w-full h-[48px] bg-primary hover:bg-primary-fixed-variant active:scale-[0.98] text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center shadow-[0_4px_6px_-2px_rgba(0,0,0,0.1)] transition-all" onclick="document.getElementById('step-create').classList.add('hidden'); document.getElementById('step-success').classList.remove('hidden');">
                    Create House
                </button>
</div>
<!-- Step 2: Success & Share Code -->
<div class="glass-panel rounded-[16px] p-lg shadow-[0_20px_25px_-5px_rgba(0,0,0,0.1),0_10px_10px_-5px_rgba(0,0,0,0.04)] flex flex-col items-center text-center" id="step-success">
<!-- Confetti/Success Graphic Placeholder -->
<div class="relative w-24 h-24 mb-md flex items-center justify-center">
<div class="absolute inset-0 bg-secondary-fixed rounded-full animate-pulse opacity-50"></div>
<div class="relative z-10 w-16 h-16 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">House Created!</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg max-w-[280px]">
                    Share this code with your roommates so they can join your house.
                </p>
<!-- House Code Display -->
<div class="w-full bg-surface-container rounded-xl p-md flex flex-col items-center justify-center border border-outline-variant mb-lg">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-xs">House Code</span>
<div class="flex items-center gap-sm">
<span class="font-display-financial text-display-financial text-primary tracking-widest font-bold">OUR5X7</span>
</div>
</div>
<!-- Actions -->
<div class="w-full space-y-sm">
<button class="w-full h-[48px] bg-primary hover:bg-primary-fixed-variant active:scale-[0.98] text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-xs shadow-[0_4px_6px_-2px_rgba(0,0,0,0.1)] transition-all">
<span class="material-symbols-outlined text-[20px]">content_copy</span>
                        Copy Code
                    </button>
<button class="w-full h-[48px] bg-surface-container-high hover:bg-surface-variant active:scale-[0.98] text-on-surface font-label-md text-label-md rounded-lg flex items-center justify-center gap-xs border border-outline-variant transition-all">
<span class="material-symbols-outlined text-[20px]">qr_code_2</span>
                        Share QR Code
                    </button>
</div>
<div class="mt-lg pt-md border-t border-surface-variant w-full">
<button class="w-full h-[48px] text-primary hover:text-primary-fixed-variant active:opacity-80 font-label-md text-label-md rounded-lg flex items-center justify-center transition-all">
                        Go to Dashboard
                    </button>
</div>
</div>
</div>
</main>
</body></html>
