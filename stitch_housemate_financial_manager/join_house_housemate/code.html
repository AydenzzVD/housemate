<!DOCTYPE html>

<style>
        body {
            background-color: #faf8ff;
            color: #191b23;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Top Navigation (Mobile/Desktop Header for linear flow - simplified) -->
<header class="fixed top-0 w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 bg-surface z-50 shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="home_work" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home_work</span>
<span class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary font-bold">HouseMate</span>
</div>
<button aria-label="Close" class="text-secondary hover:text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto mt-xxl md:mt-0">
<div class="bg-surface rounded-xl shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.1),0px_4px_6px_-2px_rgba(0,0,0,0.05)] p-lg flex flex-col gap-lg">
<!-- Header Section -->
<div class="text-center flex flex-col gap-sm items-center">
<div class="w-16 h-16 bg-primary-container/10 rounded-full flex items-center justify-center text-primary mb-sm">
<span class="material-symbols-outlined text-[32px]" data-icon="sensor_door" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sensor_door</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Join a House</h1>
<p class="font-body-md text-body-md text-secondary">
                    Ask your house admin for the house code.
                </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant sr-only" for="house-code">House Code</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors pointer-events-none material-symbols-outlined" data-icon="key">key</span>
<input autocomplete="off" class="w-full h-12 pl-[44px] pr-sm bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all uppercase" id="house-code" maxlength="8" placeholder="e.g., OUR5X7" required="" type="text"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.1)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-xs mt-sm" type="submit">
<span class="material-symbols-outlined text-[20px]" data-icon="login">login</span>
                    Join House
                </button>
</form>
<div class="text-center mt-sm">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors underline decoration-secondary/30 underline-offset-4" href="#">Need help finding your code?</a>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for input formatting
        const input = document.getElementById('house-code');
        if(input) {
            input.addEventListener('input', function(e) {
                // Force uppercase and remove non-alphanumeric
                this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            });
        }
    </script>
</body></html>
